# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions
name: Node.js CI
permissions:
  contents: read
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Temporary focused feedback loop for the Linux-only v10 select failures.
  test-ui5-select-diagnostics:
    if: github.head_ref == 'feat/wdio-v10'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.x
          cache: npm
      - run: npm ci
      - name: Trace select interactions
        run: >-
          npx wdio run test/reuse/ui5/userInteraction/test.userInteraction.conf.js
          --spec selectMultiComboBox.spec.js --spec selectBox.spec.js
          --mochaOpts.grep 'outside of a Viewport|3rd selectBox'
          --maxInstances 2 --specFileRetries 0 --logLevel warn

  lint:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [24.15.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm install -g npm@latest
        continue-on-error: true
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint

  test-core:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [24.15.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm install -g npm@latest
        continue-on-error: true
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:core

  test-authenticator:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [24.15.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm install -g npm@latest
        continue-on-error: true
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:authenticator:staticLogin

  test-common:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [24.15.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm install -g npm@latest
        continue-on-error: true
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:reuse:common

  test-ui5-1:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [24.15.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
